<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مشخصات حواله</title>
<link href="https://cdn.jsdelivr.net/gh/aminabedi68/Estedad-font@v2.0/dist/font-face.css" rel="stylesheet" type="text/css" />
<style>
:root{
  --navy-deep:#0a1a30;
  --navy:#0f2747;
  --gold:#c9a13d;
  --gold-light:#e6c66b;
  --paper:#faf6ec;
  --ink:#1b2330;
  --muted:#6b7280;
  --line:#b6a06a;
}
*{box-sizing:border-box}
body{
  font-family:'Estedad',Tahoma,Arial,sans-serif;
  direction:rtl;
  margin:20px;
  background:#ffffff;
}
#result{ display:flex; justify-content:center; }
#voucherTable{
    width:900px;
    max-width:96%;
    margin:18px auto;
    background:var(--paper);
    border:3px solid var(--gold);
    outline: 8px solid var(--navy-deep);
    outline-offset: -13px;
    border-radius:16px;
    border-collapse:separate;
    border-spacing:0;
    padding:0;
    box-shadow:0 30px 70px rgba(0,0,0,.35);
    font-family:'Estedad',Tahoma,sans-serif;
    color:var(--ink);
    overflow:hidden;
    direction:rtl;
}
#voucherTable th{
    background: linear-gradient(135deg,#0a1a30 0%,#122c52 55%,#0a1a30 100%);
    color:var(--gold-light);
    font-size:38px;
    font-weight:800;
    line-height:1.5;
    padding:28px 28px 24px;
    text-shadow:0 2px 8px rgba(0,0,0,.45);
    border-bottom:4px double var(--gold);
    text-align:center;
}
#voucherTable td{
    background:transparent;
    border-bottom:2px solid var(--line);
    padding:24px 28px;
    font-size:32px;
    font-weight:700;
    line-height:1.6;
}
#voucherTable tr:last-of-type td{ border-bottom:none; }
.label{
    width:36%;
    text-align:right;
    color:var(--navy);
    font-size:25px;
    font-weight:700;
    border-left:3px solid var(--line);
    background:linear-gradient(#f3ecd8,#efe7cf);
}
.value{
    text-align:right;
    color:var(--ink);
    font-size:32px;
    font-weight:800;
    background:var(--paper);
}
.footer{
    text-align:center;
    font-size:22px;
    font-weight:700;
    background:linear-gradient(#f6f1e3,#efe7d1)!important;
    border-top:3px solid var(--gold);
    white-space:nowrap;
    padding:22px 16px;
    color:var(--navy);
}
</style>
</head>
<body>
<div id="result">
  <table id="voucherTable">
    <tr><th colspan="2">مشخصات حواله {{PROVINCE}}</th></tr>
    <tr><td class="label">تاریخ</td><td class="value" id="dateCell">-</td></tr>
    <tr><td class="label">شماره حواله</td><td class="value">{{NUM}}</td></tr>
    <tr><td class="label">مبلغ</td><td class="value">{{AMOUNT}}</td></tr>
    <tr><td class="label">فرستنده</td><td class="value">{{SENDER}}</td></tr>
    <tr><td class="label">گیرنده</td><td class="value">{{RECEIVER}}</td></tr>
    <tr><td colspan="2" class="footer">📍 {{ADDRESS}}</td></tr>
  </table>
</div>
<script>
(function(){
  var parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
    timeZone: 'Asia/Kabul', weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date());
  function g(t){ var p = parts.find(function(x){ return x.type === t; }); return p ? p.value : ''; }
  document.getElementById('dateCell').textContent =
    g('weekday') + ' - ' + g('year') + '/' + g('month') + '/' + g('day');
})();
</script>
</body>
</html>
