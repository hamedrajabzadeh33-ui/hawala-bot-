services:
  - type: web
    name: telegram-voucher-bot-python
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && curl -fsSL -o Lalezar.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/lalezar/Lalezar-Regular.ttf && curl -fsSL -o Vazirmatn-Bold.ttf https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Bold.ttf
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PORT
        value: 3000
      - key: PYTHON_VERSION
        value: 3.11.9